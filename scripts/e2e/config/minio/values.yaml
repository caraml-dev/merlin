replicas: 4

# Built from the original upstream releases and imported into k3d by setup-cluster.sh.
image:
  repository: merlin-e2e/minio
  tag: RELEASE.2022-03-24T00-43-44Z
  pullPolicy: Never

mcImage:
  repository: merlin-e2e/mc
  tag: RELEASE.2022-03-17T20-25-06Z
  pullPolicy: Never

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits: ~

accessKey: YOURACCESSKEY
secretKey: YOURSECRETKEY

rootUser: YOURACCESSKEY
rootPassword: YOURSECRETKEY

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: istio
  path: /
  hosts:
    - minio.minio.127.0.0.1.nip.io

consoleIngress:
  enabled: false

buckets:
  - name: mlflow
    policy: none
    purge: false
    versioning: false
